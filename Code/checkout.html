<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bright Techsoulton - Checkout</title>
  <!-- External stylesheet for consistent styling -->
  <link rel="stylesheet" href="../Style/style.css">
</head>
<body>
  <!-- ================= Checkout Page Heading ================= -->
  <h1>Checkout</h1>

  <!-- Cart summary will be dynamically populated by checkout.js -->
  <div id="cartSummary"></div>

  <!-- ================= Shipping & Payment Form ================= -->
  <form id="shippingForm">
    <!-- Customer name -->
    <label for="name">Name</label>
    <input type="text" id="name" required>

    <!-- Shipping address -->
    <label for="address">Address</label>
    <input type="text" id="address" required>

    <!-- Amount being paid -->
    <label for="amount">Amount Being Paid</label>
    <input type="number" id="amount" required>

    <!-- Payment method selection -->
    <label for="paymentMethod">Payment Method</label>
    <select id="paymentMethod" name="paymentMethod" required>
      <option value="">-- Select Payment Method --</option>
      <option value="Cash">Cash</option>
      <option value="Credit Card">Credit Card</option>
      <option value="Debit Card">Debit Card</option>
      <option value="Bank Transfer">Bank Transfer</option>
      <option value="Mobile Wallet">Mobile Wallet</option>
    </select>

    <!-- ================= Form Action Buttons ================= -->
    <!-- Confirm order submission -->
    <button type="submit">Confirm</button>
    <!-- Cancel checkout process -->
    <button type="button" onclick="cancelCheckout()">Cancel</button>
    <!-- Clear all cart items -->
    <button type="button" onclick="clearCart()">Clear All</button>
    <!-- Proceed to checkout logic -->
    <button type="button" onclick="checkout()">Check Out</button>
    <!-- Close checkout page -->
    <button type="button" onclick="closeCheckout()">Close</button>
  </form>
  
  <!-- ================= Script ================= -->
  <!-- External JS file containing checkout logic -->
  <script src="../Style/checkout.js"></script>
</body>
</html>
